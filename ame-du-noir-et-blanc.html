<section class="serie-title room-title"><p class="room-title-num">SALLE <strong>02</strong></p><h1>L’âme du noir et blanc</h1><p class="room-title-meta">Octobre 2026 · 22 photographies</p></section>
<section class="book-pages opening-pages">
<figure><img alt="Couverture de L’âme du noir et blanc" src="assets/series/ame/book/couverture.jpg"/></figure>
<figure class="wall-text-panel">
  <div class="wall-text-inner">
    <h3>Le cadrage de l’infini</h3>
    <p>Il y a dans chaque image un soupçon de démesure. Un éclat d’espace, un battement du monde suspendu.</p>
    <p>Photographier, ce n’est pas arrêter&nbsp;: c’est retenir l’élan, le saisir avant qu’il ne s’efface.</p>
    <p>À travers le viseur, je regarde un monde sans bords. Je n’en retiens que mon œil, un instant, un geste, un souffle.</p>
    <p>Et pourtant, j’ose&nbsp;: je réduis l’infini au silence d’un rectangle.</p>
    <p>Le cadre n’est pas une prison. Il est une frontière perméable, une invitation à deviner ce qui déborde.</p>
    <p>La lumière circule, le vent traverse. L’image est fixe, mais ce qu’elle contient palpite encore.</p>
    <p>Parfois, l’évidence se voile. Le monde s’absente pour mieux apparaître.</p>
    <p>Alors je marche, je m’arrête, je cadre.</p>
    <p>Cette série est une traversée de paysages réels et intérieurs, une tentative de faire tenir l’invisible dans le visible&nbsp;— non pas une scène, mais un passage.</p>
  </div>
</figure>
<figure class="wall-text-panel">
  <div class="wall-text-inner">
    <h3>Cette densité est la mémoire<br>de la lumière.</h3>
    <p>Ces images ne cherchent pas à raconter.</p>
    <p>Elles écoutent.</p>
  </div>
</figure>
</section>
<section class="serie-sequence">
<h2 class="sequence-title">Le Silence du Monde</h2><figure class="serie-photo">
<img alt="" decoding="async" loading="lazy" src="assets/series/ame/01.jpg"/>
<figcaption class="book-text">Le vent s’est tu avec les arbres.<br/>La forêt qui s’arrête derrière moi<br/>laisse apparaître la montagne.<br/>Silence.</figcaption>
</figure><figure class="serie-photo">
<img alt="" decoding="async" loading="lazy" src="assets/series/ame/02.jpg"/>
<figcaption class="book-text">Le ciel se fragmente,<br/>le vide se met en mouvement.<br/>La forme hésite,<br/>se défait déjà.<br/>Ce qui compte<br/>n’est pas la direction,<br/>mais la tenue provisoire<br/>d’un ensemble.<br/>Puis le ciel reprend<br/>sa respiration.</figcaption>
</figure><figure class="serie-photo">
<img alt="" decoding="async" loading="lazy" src="assets/series/ame/03.jpg"/>
<figcaption class="book-text">Lorsque l’air s’épaissit,<br/>le groupe se resserre.<br/>Immobile.<br/>Une île sombre.</figcaption>
</figure><figure class="serie-photo">
<img alt="" decoding="async" loading="lazy" src="assets/series/ame/04.jpg"/>
<figcaption class="book-text">La ligne glisse.<br/>Sans commencement lisible,<br/>sans point d’arrêt.</figcaption>
</figure><figure class="serie-photo">
<img alt="" decoding="async" loading="lazy" src="assets/series/ame/05.jpg"/>
<figcaption class="book-text">La lumière ne tombe pas.<br/>L’arbre recueille l’air.<br/>L’ombre s’organise autour de lui.</figcaption>
</figure><h2 class="sequence-title">Seuils et Passages</h2><figure class="serie-photo">
<img alt="" decoding="async" loading="lazy" src="assets/series/ame/06.jpg"/>
<figcaption class="book-text">Une limite scintille.<br/>L’air devient visible,<br/>retenu sur un fil.</figcaption>
</figure><figure class="serie-photo">
<img alt="" decoding="async" loading="lazy" src="assets/series/ame/07.jpg"/>
<figcaption class="book-text">La lumière atteint.<br/>Elle ne cherche plus.<br/>Elle frappe une face,<br/>laisse l’autre en attente.<br/>La roche répond.</figcaption>
</figure><figure class="serie-photo">
<img alt="" decoding="async" loading="lazy" src="assets/series/ame/08.jpg"/>
<figcaption class="book-text">Le vent incline l’herbe.<br/>Une ligne glisse,<br/>puis se retire.</figcaption>
</figure><figure class="serie-photo">
<img alt="" decoding="async" loading="lazy" src="assets/series/ame/09.jpg"/>
<figcaption class="book-text">Il se tient dans la brume,<br/>si proche,<br/>si loin.<br/>Au-delà,<br/>tout s’ouvre.</figcaption>
</figure><figure class="serie-photo">
<img alt="" decoding="async" loading="lazy" src="assets/series/ame/10.jpg"/>
<figcaption class="book-text">La lumière s’accumule<br/>entre deux pentes,<br/>sans passage.<br/>L’air bute,<br/>se replie,<br/>demeure suspendu.</figcaption>
</figure><figure class="serie-photo">
<img alt="" decoding="async" loading="lazy" src="assets/series/ame/11.jpg"/>
<figcaption class="book-text">La lumière s’étale.</figcaption>
</figure><h2 class="sequence-title">Présence des choses</h2><figure class="serie-photo">
<img alt="" decoding="async" loading="lazy" src="assets/series/ame/12.jpg"/>
<figcaption class="book-text">La même courbe<br/>passe du ciel<br/>à la pierre.<br/>Ce qui était éther<br/>devient matière.</figcaption>
</figure><figure class="serie-photo">
<img alt="" decoding="async" loading="lazy" src="assets/series/ame/13.jpg"/>
<figcaption class="book-text">Rien ne se distingue.<br/>Tout s’assemble,<br/>par adhérence.<br/>La matière<br/>apprend à tenir<br/>contre elle-même.</figcaption>
</figure><figure class="serie-photo">
<img alt="" decoding="async" loading="lazy" src="assets/series/ame/14.jpg"/>
<figcaption class="book-text">Aucune mesure ne tient.<br/>Ce qui était masse<br/>se fragmente.<br/>La vue rassemble<br/>ce que le sol disperse.</figcaption>
</figure><figure class="serie-photo">
<img alt="" decoding="async" loading="lazy" src="assets/series/ame/15.jpg"/>
<figcaption class="book-text">Le galet s’effrite.<br/>La matière<br/>devient grain.</figcaption>
</figure><figure class="serie-photo">
<img alt="" decoding="async" loading="lazy" src="assets/series/ame/16.jpg"/>
<figcaption class="book-text">La forme s’efface.<br/>Un rythme demeure.</figcaption>
</figure><figure class="serie-photo">
<img alt="" decoding="async" loading="lazy" src="assets/series/ame/17.jpg"/>
<figcaption class="book-text">Ce qui tenait<br/>se défait.<br/>Il reste<br/>un souffle.</figcaption>
</figure><figure class="serie-photo">
<img alt="" decoding="async" loading="lazy" src="assets/series/ame/18.jpg"/>
<figcaption class="book-text">La matière résiste.<br/>Encore.<br/>Se dresse.</figcaption>
</figure><h2 class="sequence-title">Vers la lumière</h2><figure class="serie-photo">
<img alt="" decoding="async" loading="lazy" src="assets/series/ame/19.jpg"/>
<figcaption class="book-text">La lumière ne tombe plus.<br/>Elle circule.<br/>Elle traverse sans nommer,<br/>se dépose sans s’arrêter.<br/>Il n’y a plus de seuil à franchir,<br/>seulement une continuité lente<br/>où le regard cesse de chercher<br/>et commence à demeurer.</figcaption>
</figure><figure class="serie-photo">
<img alt="" decoding="async" loading="lazy" src="assets/series/ame/20.jpg"/>
<figcaption class="book-text">Le ciel.<br/>L’eau.<br/>Une ligne.</figcaption>
</figure><figure class="serie-photo">
<img alt="" decoding="async" loading="lazy" src="assets/series/ame/21.jpg"/>
<figcaption class="book-text">Tout se mêle.<br/>L’eau s’écrit<br/>en blanc.</figcaption>
</figure><figure class="serie-photo">
<img alt="" decoding="async" loading="lazy" src="assets/series/ame/22.jpg"/>
</figure>
</section>
<section class="book-pages closing-pages">
<figure class="wall-text-panel wall-poem">
  <div class="wall-text-inner">
    <p>L’âme est l’ombre entre les lumières,<br>Un souffle pâle aux pas légers,<br>Un chant voilé dans la poussière,<br>Un battement long à figer.</p>
    <p>Elle est ce qui s’ancre dans le noir,<br>Ce qui affleure au bord du blanc,<br>Un lent frisson dans la mémoire<br>D’un éclat retenu dans l’instant.</p>
    <p>C’est un écho, sans source d’origine,<br>Une présence aux reflets mouvants,<br>Un fil de vie que l’art dessine,<br>Un souffle nu, presque vivant.</p>
    <p>Entre le noir et le blanc,<br>le monde ne disparaît pas.</p>
    <p>Il change d’état.</p>
  </div>
</figure>
